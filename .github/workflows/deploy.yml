name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - main
      - master

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}     # Add GCP_PROJECT_ID to your GitHub Repository Secrets
  SERVICE_NAME: eli-lead-classifier             # Name of your Cloud Run service
  REGION: us-central1                           # Target GCP Region for deployment

jobs:
  deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Google Cloud Authentication
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }} # Add GCP_SA_KEY to your GitHub Repository Secrets

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker for Artifact Registry
        run: |
          # Automatically configures Docker authentication to push to GCP
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Create Artifact Registry Repository (If Not Exists)
        run: |
          # Ensures target repository exists before pushing
          gcloud artifacts repositories create cloudrun-sources \
            --repository-format=docker \
            --location=${{ env.REGION }} \
            --description="Docker repository for Cloud Run sources" \
            --quiet || true

      - name: Build and Push Container Image
        run: |
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/cloudrun-sources/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          
          # Build using the production Dockerfile we created
          docker build -t $IMAGE_TAG .
          docker push $IMAGE_TAG
          
          # Pass the dynamic tag to the next step
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Deploy Container to Google Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE_TAG }}
          # Expose public access to the Service
          flags: --allow-unauthenticated
          # Inject secrets and configuration
          env_vars: |
            NODE_ENV=production
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
