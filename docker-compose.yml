version: '3.8'

services:
  lead-intelligence:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lead-intelligence-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3005:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APP_URL=https://leadAI.proteustech.in
      
      # Database connection to your PostgreSQL on OCI
      - SQL_HOST=10.0.1.50 # Change to your PostgreSQL private IP or docker host
      - SQL_PORT=5432
      - SQL_USER=postgres
      - SQL_PASSWORD=your_secure_password
      - SQL_DB_NAME=lead_intelligence_db
      
      # Google & Gemini API Keys
      - GEMINI_API_KEY=your_gemini_api_key_here
      # Optional if using direct connection string:
      # - DATABASE_URL=postgresql://postgres:password@10.0.1.50:5432/lead_intelligence_db
